<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNav // 极客导航</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 33, 46, 0.85);
            --text-main: #fcfcfc;
            --text-muted: #8a99a8;
            --border-active: #30363d;
            --hover-glow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { background: radial-gradient(circle at top center, #161b22 0%, var(--bg-color) 100%); color: var(--text-main); min-height: 100vh; padding: 60px 20px; overflow-x: hidden; display: flex; flex-direction: column; }
        .container { max-width: 1100px; margin: 0 auto; position: relative; z-index: 10; flex: 1; width: 100%; }
        header { text-align: center; margin-bottom: 50px; padding-bottom: 30px; }
        header h1 { font-size: 2rem; color: #ffffff; letter-spacing: 1px; margin-bottom: 30px; font-weight: 600; }
        .search-box { display: flex; max-width: 600px; margin: 0 auto; border: 1px solid var(--border-active); background: rgba(1, 4, 9, 0.8); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); transition: border-color 0.3s; }
        .search-box:focus-within { border-color: #0284c7; }
        .search-box input { flex: 1; background: transparent; border: none; color: var(--text-main); padding: 16px 20px; font-size: 1.05rem; outline: none; }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box button { background: #0284c7; color: #ffffff; border: none; padding: 0 30px; font-weight: 500; cursor: pointer; font-size: 1rem; transition: background-color 0.2s; }
        .search-box button:hover { background: #0369a1; }
        .category { margin-bottom: 40px; border: 1px solid var(--border-active); padding: 20px 25px; background: var(--panel-bg); border-radius: 10px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }
        .cat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .category-title { font-size: 1.15rem; color: #e6edf3; font-weight: 600; }
        .bookmark-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .bookmark-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-active); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: var(--text-main); transition: all 0.2s ease-out; position: relative; border-radius: 8px; }
        .bookmark-card:hover { border-color: rgba(255, 255, 255, 0.2); box-shadow: var(--hover-glow); transform: translateY(-2px); background: rgba(255, 255, 255, 0.06); }
        .card-content { display: flex; align-items: center; gap: 12px; flex: 1; overflow: hidden; }
        .bookmark-card img { width: 24px; height: 24px; border-radius: 5px; background: #fff; padding: 2px; object-fit: contain; }
        .bookmark-card span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; font-weight: 500; color: #c9d1d9; transition: color 0.2s; }
        .bookmark-card:hover span { color: #ffffff; }
        .loading { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 1.2rem; }
        footer { text-align: center; padding: 30px 0; margin-top: auto; }
        footer a { color: var(--border-active); text-decoration: none; font-size: 0.85rem; transition: color 0.3s; }
        footer a:hover { color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Personal Workspace</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="使用 Google 搜索..." autocomplete="off">
                <button onclick="executeSearch()">Search</button>
            </div>
        </header>

        <main id="mainContent">
            <div class="loading">正在从云端加载数据...</div>
        </main>
    </div>

    <footer>
        <a href="/admin.html">Console / 控制台</a>
    </footer>

    <script>
        async function fetchBookmarks() {
            try {
                const response = await fetch('/api/bookmarks');
                const data = await response.json();
                render(Array.isArray(data) ? data : []);
            } catch (error) {
                document.getElementById('mainContent').innerHTML = '<div class="loading" style="color:#f85149;">系统离线，无法获取数据</div>';
            }
        }

        function render(navData) {
            const main = document.getElementById('mainContent');
            main.innerHTML = ''; 
            if (navData.length === 0) {
                main.innerHTML = '<div class="loading">暂无公开书签数据。</div>';
                return;
            }
            navData.forEach(category => {
                const section = document.createElement('section');
                section.className = 'category';
                section.innerHTML = `<div class="cat-header"><div class="category-title">${category.name}</div></div>`;
                const grid = document.createElement('div');
                grid.className = 'bookmark-grid';
                category.bookmarks.forEach(bm => {
                    const iconUrl = `https://www.google.com/s2/favicons?domain=${bm.url}&sz=64`;
                    const card = document.createElement('a');
                    card.href = bm.url;
                    card.target = "_blank";
                    card.className = 'bookmark-card';
                    card.innerHTML = `
                        <div class="card-content">
                            <img src="${iconUrl}" alt="icon" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgZmlsbD0iI2ZmZiI+PHBhdGggZD0iTTEyIDJhMTAgMTAgMCAxIDAgMTAgMTAgMTAgMTAgMCAwIDAtMTAtMTB6bTAgMTZhNiA2IDAgMSAxIDYtNiA2IDYgMCAwIDEtNiA2eiIvPjwvc3ZnPg=='">
                            <span>${bm.name}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                section.appendChild(grid);
                main.appendChild(section);
            });
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
        }
        document.getElementById('searchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') executeSearch();
        });

        fetchBookmarks();
    </script>
</body>
</html>
